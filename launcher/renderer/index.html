<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>小说创作工作台 启动器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">📖</div>
      <div>
        <h1>小说创作工作台</h1>
        <p class="subtitle">一键启动 · 元素库 / 情节板 / 创作台</p>
      </div>
    </div>
    <div class="status-wrap">
      <span id="statusPill" class="pill stopped">○ 已停止</span>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>启动</h2>

      <div class="field">
        <label for="project">项目目录</label>
        <div class="row">
          <select id="project"></select>
          <button id="browseBtn" class="ghost" type="button">浏览…</button>
        </div>
        <div class="dirline">目录：<code id="dirPath">—</code></div>
      </div>

      <div class="field">
        <label for="port">端口 <span class="hint">(默认 3001)</span></label>
        <input id="port" type="number" min="1" max="65535" placeholder="3001" />
      </div>

      <div class="actions">
        <button id="startBtn" class="primary" type="button">▶ 启动</button>
        <button id="stopBtn" class="danger" type="button" disabled>■ 停止</button>
        <button id="openBtn" class="ghost" type="button" disabled>在浏览器打开</button>
        <label class="check">
          <input id="autoOpen" type="checkbox" checked />
          启动后自动打开浏览器
        </label>
      </div>

      <div id="runtime" class="runtime hidden">
        <div class="runtime-line">状态：<strong id="rtStatus">运行中</strong></div>
        <div class="runtime-line">PID：<code id="rtPid">—</code></div>
        <div class="runtime-line">URL：<a id="rtUrl" href="#" target="_blank" rel="noreferrer">—</a></div>
      </div>
    </section>

    <section class="card log-card">
      <div class="log-head">
        <h2>运行日志</h2>
        <button id="clearLogBtn" class="ghost small" type="button">清空</button>
      </div>
      <pre id="log" class="log">尚未启动。点击「启动」开始。</pre>
    </section>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
