name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（server + client workspaces）
        run: npm install

      - name: 类型检查（非阻断）
        # typescript@7 为原生编译器，若在 CI 下载二进制失败，不阻断构建
        continue-on-error: true
        run: npm run typecheck -w client

      - name: 构建前端（Rollup + Babel）
        run: npm run build

      - name: 安装启动器依赖
        run: npm install
        working-directory: launcher

      - name: 构建启动器 EXE（便携版）
        run: npm run build:win
        working-directory: launcher
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传 EXE 工件
        uses: actions/upload-artifact@v4
        with:
          name: NovelWorkbench-Launcher
          path: launcher/dist/*.exe
          if-no-files-found: error

      - name: 创建 GitHub Release（tag 或手动触发时）
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: launcher/dist/*.exe
          generate_release_notes: true
